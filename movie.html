<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Website</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            max-width: 1400px;
            margin: auto;
        }

        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-button {
            width: 100%;
            padding: 14px;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-wrap {
            width: 100%;
            flex: 1;
            aspect-ratio: 16 / 9;
            max-height: 700px;
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .player-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .player-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .player-buttons button {
            padding: 10px 18px;
        }

        @media(max-width:900px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }
        }

        #savedShows {
            display: flex;
            flex-direction: column;
            gap: 8px;

            max-height: 141px;
            overflow-y: auto;
        }

        .saved-show {
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .saved-show:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

    <div class="layout">

        <div class="sidebar">

            <div class="card">
                <h3>Swap Button</h3>
                <button class="nav-button" onclick="location.href='index.html'">Shows</button>
            </div>

            <div class="card">
                <h3>Movie ID</h3>
                <input type="text" id="id-input" placeholder="Enter a Movie Name">
            </div>

            <div class="card">
                <h3>Saved Movies</h3>
                <div id="savedShows"></div>
            </div>

        </div>

        <div class="player-section">

            <div class="player-wrap">
                <iframe id="player" src="https://vsembed.su/embed/tv?imdb=tt0491738&season=1&episode=1"
                    allowfullscreen></iframe>
            </div>

            <div class="player-buttons"></div>

        </div>
    </div>

    <script>
        let currentId = localStorage.getItem("movieId") || "550";
        let currentName = localStorage.getItem("movieName") || "Fight Club";

        const player = document.getElementById('player');
        const idInput = document.getElementById('id-input');
        const savedShows = document.getElementById("savedShows");

        function movieServers() {
            return [
                `https://peachify.pro/embed/movie/${currentId}`,
                `https://vidup.to/movie/${currentId}?nextButton=false&autoNext=false`,
                `https://vidsrc.sh/embed/movie/${currentId}`,
                `https://player.vidlove.cc/embed/movie/${currentId}`,
                `https://vidfast.vc/movie/${currentId}?nextButton=false&autoNext=false`,
                `https://vidnest.fun/movie/${currentId}`
            ];
        }

        let currentServer = 2;

        const playerButtons = document.querySelector(".player-buttons");

        movieServers().forEach((_, index) => {
            const button = document.createElement("button");
            button.className = "server-btn";
            button.dataset.server = index;
            button.textContent = `Server ${index + 1}`;

            playerButtons.appendChild(button);
        });

        idInput.value = currentName;

        function updateSavedMovies() {
            const movies = JSON.parse(localStorage.getItem("movies")) || {};
            savedShows.innerHTML = "";

            for (const id in movies) {
                const div = document.createElement("div");
                div.className = "saved-show";
                div.textContent = movies[id].name;

                div.addEventListener("click", function () {
                    currentId = id;
                    currentName = movies[id].name;

                    idInput.value = currentName;

                    updatePlayer();
                });

                div.addEventListener("dblclick", function () {
                    delete movies[id];

                    localStorage.setItem(
                        "movies",
                        JSON.stringify(movies)
                    );

                    if (id === currentId) {
                        currentId = "";
                        currentName = "";

                        player.src = "";
                        idInput.value = "";

                        localStorage.removeItem("movieId");
                        localStorage.removeItem("movieName");
                    }
                    updateSavedMovies();
                });
                savedShows.appendChild(div);
            }
        }

        function saveMovie() {
            let movies = JSON.parse(localStorage.getItem("movies")) || {};

            movies[currentId] = {
                name: currentName
            };

            localStorage.setItem("movies", JSON.stringify(movies));
            localStorage.setItem("movieId", currentId);
            localStorage.setItem("movieName", currentName);
            updateSavedMovies();
        }

        function updatePlayer() {
            player.src = movieServers()[currentServer];
            //god
            saveMovie();
        }

        updatePlayer();
        updateSavedMovies();

        idInput.addEventListener("keydown", async function (event) {
            if (event.key !== "Enter") return;

            const query = this.value.trim();
            if (!query) return;
            try {
                const response = await fetch(`/api/tmdbMT?q=${encodeURIComponent(query)}`);

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();

                if (data.results.length > 0) {
                    const movie = data.results[0];

                    currentName = movie.title;
                    currentId = movie.id.toString();

                    idInput.value = currentName;

                    updatePlayer();
                } else {
                    console.log("No movie found.");
                }

            } catch (error) {
                console.error(error);
            }
        });

        document.querySelectorAll(".server-btn").forEach(button => {
            button.addEventListener("click", function () {
                currentServer = Number(this.dataset.server);
                updatePlayer();
            });
        });

    </script>

</body>

</html>
