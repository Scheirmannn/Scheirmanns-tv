<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Website</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            max-width: 1400px;
            margin: auto;
        }

        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-button {
            width: 100%;
            padding: 14px;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-wrap {
            width: 100%;
            flex: 1;
            aspect-ratio: 16 / 9;
            max-height: 700px;
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .player-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .player-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .player-buttons button {
            padding: 10px 18px;
        }

        @media(max-width:900px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }
        }

        #savedShows {
            display: flex;
            flex-direction: column;
            gap: 8px;

            max-height: 141px;
            overflow-y: auto;
        }

        .saved-show {
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .saved-show:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

    <div class="layout">

        <div class="sidebar">

            <div class="card">
                <h3>Swap Button</h3>
                <button class="nav-button" onclick="location.href='movie.html'">Movies</button>
            </div>

            <div class="card">
                <h3>Show ID</h3>
                <input type="text" id="id-input" placeholder="Enter a Show Name">
            </div>

            <div class="card">
                <h3>Season</h3>
                <div class="control-row">
                    <button id="prevSs-btn">&larr;</button>
                    <span id="Season-label">Season: 1</span>
                    <button id="nextSs-btn">&rarr;</button>
                </div>
            </div>

            <div class="card">
                <h3>Episode</h3>
                <div class="control-row">
                    <button id="prevEp-btn">&larr;</button>
                    <span id="Episode-label">Episode: 1</span>
                    <button id="nextEp-btn">&rarr;</button>
                </div>
            </div>

            <div class="card">
                <h3>Saved Shows</h3>
                <div id="savedShows"></div>
            </div>

        </div>

        <div class="player-section">
            <div class="player-wrap">
                <iframe id="player" src="https://vsembed.su/embed/tv?imdb=tt0491738&season=1&episode=1"
                    allowfullscreen></iframe>
            </div>

            <div class="player-buttons"></div>

        </div>
    </div>

    <script>
        let currentId = localStorage.getItem("currentId") || "1100";
        let currentSsIndex = 1;
        let currentEpIndex = 1;
        let currentName = localStorage.getItem("currentName") || "How I Met Your Mother";

        const player = document.getElementById('player');
        const episodeLabel = document.getElementById('Episode-label');
        const seasonLabel = document.getElementById('Season-label');
        const idInput = document.getElementById('id-input');
        const savedShows = document.getElementById("savedShows");

        function tvServers() {
            return [
                `https://peachify.pro/embed/tv/${currentId}/${currentSsIndex}/${currentEpIndex}`,
                `https://vidup.to/tv/${currentId}/${currentSsIndex}/${currentEpIndex}?nextButton=false&autoNext=false`,
                `https://vidsrc.sh/embed/tv/${currentId}/${currentSsIndex}/${currentEpIndex}`,
                `https://player.vidlove.cc/embed/tv/${currentId}/${currentSsIndex}/${currentEpIndex}`,
                `https://vidfast.vc/tv/${currentId}/${currentSsIndex}/${currentEpIndex}?nextButton=false&autoNext=false`,
                `https://vidnest.fun/tv/${currentId}/${currentSsIndex}/${currentEpIndex}`,
            ];
        }

        let currentServer = 2;

        const playerButtons = document.querySelector(".player-buttons");

        tvServers().forEach((_, index) => {
            const button = document.createElement("button");
            button.className = "server-btn";
            button.dataset.server = index;
            button.textContent = `Server ${index + 1}`;

            playerButtons.appendChild(button);
        });

        idInput.value = currentName;

        function updateSavedShows() {
            const progress = JSON.parse(localStorage.getItem("progress")) || {};

            savedShows.innerHTML = "";

            for (const id in progress) {
                const div = document.createElement("div");
                div.className = "saved-show";

                const show = progress[id];

                div.textContent =
                    `${show.name || id} - S${show.season}E${show.episode}`;

                div.addEventListener("click", function () {
                    currentId = id;
                    currentName = show.name
                    idInput.value = show.name;
                    loadProgress(id);
                    updatePlayer();
                });

                div.addEventListener("dblclick", function () {
                    let progress = JSON.parse(localStorage.getItem("progress")) || {};

                    delete progress[id];

                    if (id === currentId) {
                        currentId = "";
                        currentName = "";
                        currentSsIndex = 1;
                        currentEpIndex = 1;

                        idInput.value = "";

                        player.src = "";
                        episodeLabel.textContent = "Episode: 1";
                        seasonLabel.textContent = "Season: 1";

                        localStorage.removeItem("currentId");
                        localStorage.removeItem("currentName");
                    }

                    localStorage.setItem("progress", JSON.stringify(progress));
                    updateSavedShows();
                });

                savedShows.appendChild(div);
            }

        }

        function saveProgress() {
            let progress = JSON.parse(localStorage.getItem("progress")) || {};

            progress[currentId] = {
                name: currentName,
                season: currentSsIndex,
                episode: currentEpIndex
            };

            localStorage.setItem("progress", JSON.stringify(progress));
            localStorage.setItem("currentId", currentId);
            localStorage.setItem("currentName", currentName);
            updateSavedShows();
        }

        function loadProgress(id) {
            let progress = JSON.parse(localStorage.getItem("progress")) || {};

            if (progress[id]) {
                currentSsIndex = progress[id].season;
                currentEpIndex = progress[id].episode;
            } else {
                currentSsIndex = 1;
                currentEpIndex = 1;
            }
        }

        function updatePlayer() {
            player.src = tvServers()[currentServer];
            episodeLabel.textContent = `Episode: ${currentEpIndex}`;
            seasonLabel.textContent = `Season: ${currentSsIndex}`;
            //god
            saveProgress();
        }

        loadProgress(currentId);
        updatePlayer();

        idInput.addEventListener("keydown", async function (event) {
            if (event.key !== "Enter") return;

            const query = this.value.trim();

            if (!query) return;

            try {
                const response = await fetch(`/api/tmdbTvT?q=${encodeURIComponent(query)}`);

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();

                if (data.results.length > 0) {
                    const show = data.results[0];

                    currentName = show.name;
                    currentId = show.id.toString();
                    idInput.value = currentName
                    loadProgress(currentId);
                    updatePlayer();
                } else {
                    console.log("No show found.");
                }
            } catch (error) {
                console.error(error);
            }
        });

        document.getElementById('nextEp-btn').addEventListener('click', function () {
            currentEpIndex++;
            updatePlayer();
        });

        document.getElementById('prevEp-btn').addEventListener('click', function () {
            if (currentEpIndex > 1) {
                currentEpIndex--;
                updatePlayer();
            }
        });

        document.getElementById('nextSs-btn').addEventListener('click', function () {
            currentSsIndex++
            currentEpIndex = 1;
            updatePlayer();
        });

        document.getElementById('prevSs-btn').addEventListener('click', function () {
            if (currentSsIndex > 1) {
                currentSsIndex--;
                currentEpIndex = 1;
                updatePlayer();
            }
        });

        document.querySelectorAll(".server-btn").forEach(button => {
            button.addEventListener("click", function () {
                currentServer = Number(this.dataset.server);
                updatePlayer();
            });
        });

    </script>

</body>

</html>
